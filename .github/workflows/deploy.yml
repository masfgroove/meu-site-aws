
name: Deploy Angular para AWS

on:
  push:
    branches: [ main ]

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
    - name: Copiar código do repositório
      uses: actions/checkout@v3

    - name: Autenticar no Docker Hub
      uses: docker/login-action@v2
      with:
        username: ${{ secrets.DOCKER_USER }}
        password: ${{ secrets.DOCKER_PASSWORD }}

    - name: Construir e enviar imagem Docker
      uses: docker/build-push-action@v4
      with:
        context: .
        push: true
        tags: ${{ secrets.DOCKER_USER }}/meu-site-aws:latest

    - name: Atualizar servidor na AWS via SSH
      uses: appleboy/ssh-action@master
      with:
        host: ${{ secrets.AWS_HOST }}
        username: ${{ secrets.AWS_USER }}
        key: ${{ secrets.AWS_SSH_KEY }}
        script: |
          sudo docker pull ${{ secrets.DOCKER_USER }}/meu-site-aws:latest
          sudo docker rm -f meu-site-producao || true
          sudo docker run -d -p 80:80 --name meu-site-producao ${{ secrets.DOCKER_USER }}/meu-site-aws:latest